services:
  # 1. Database (Postgres with pgvector enabled by default on Render)
  - type: database
    name: devscope-db
    databaseName: repo_explainer
    user: postgres
    plan: free

  # 2. Redis (for BullMQ queue processing)
  - type: redis
    name: devscope-redis
    plan: free
    ipAllowList: [] # empty means accessible only internally by other services in this blueprint

  # 3. Backend API (Express Web Service)
  - type: web
    name: devscope-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devscope-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: devscope-redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: FRONTEND_LINK
        fromService:
          name: devscope-frontend
          property: url

  # 4. Background Ingest Worker (Ingest Queue processing)
  - type: worker
    name: devscope-ingest-worker
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/workers/ingestWorker.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devscope-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: devscope-redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # 5. Background Metrics Worker (Evaluation/Metrics processing)
  - type: worker
    name: devscope-metrics-worker
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/workers/metricsWorker.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devscope-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: devscope-redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # 6. Frontend Static Site
  - type: web
    name: devscope-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: devscope-api
          property: url
